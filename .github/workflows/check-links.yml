name: check-links

# Build the Hugo site and validate every internal link in the
# generated output. A red X on a commit / PR means a link is
# broken or the dev baseURL leaked into public/.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  LYCHEE_VERSION: v0.24.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # enableGitInfo in hugo.toml wants full history

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Build site
        run: hugo --minify --gc --cleanDestinationDir

      - name: Guard against dev-baseURL leaks
        run: |
          set -e
          LEAKS=$(grep -rEln 'http://localhost:[0-9]+|http://127\.0\.0\.1' public/ \
                    --include='*.html' --include='*.xml' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Dev baseURL leaked into public/"
            echo "$LEAKS"
            exit 1
          fi

      # lychee-action's bundled installer assumes the binary sits
      # at the tarball root, but v0.24.x ships it under
      # lychee-x86_64-unknown-linux-gnu/. Install it ourselves.
      - name: Install lychee ${{ env.LYCHEE_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSL \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          install /tmp/lychee-x86_64-unknown-linux-gnu/lychee "$HOME/.local/bin/lychee"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/lychee" --version

      - name: Check links with lychee
        run: |
          lychee \
            --config lychee.toml \
            --root-dir "$GITHUB_WORKSPACE/public" \
            --remap "https://sloppyquorum.com/ file://$GITHUB_WORKSPACE/public/" \
            --offline \
            './public/**/*.html' './public/**/*.xml'
