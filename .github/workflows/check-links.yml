name: check-links

# Build the Hugo site and validate every internal link in the
# generated output. A red X on a commit / PR means a link is
# broken or the dev baseURL leaked into public/.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # enableGitInfo in hugo.toml wants full history

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Build site
        run: hugo --minify --gc --cleanDestinationDir

      - name: Guard against dev-baseURL leaks
        run: |
          set -e
          LEAKS=$(grep -rEln 'http://localhost:[0-9]+|http://127\.0\.0\.1' public/ \
                    --include='*.html' --include='*.xml' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Dev baseURL leaked into public/"
            echo "$LEAKS"
            exit 1
          fi

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: "0.24.2"
          # Offline mode: only validate internal links (fast,
          # deterministic, no flaky external 5xx). Run online
          # checks manually via workflow_dispatch when needed.
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/public
            --remap "https://sloppyquorum.com/ file://${{ github.workspace }}/public/"
            --offline
            ./public/**/*.html
            ./public/**/*.xml
          fail: true
